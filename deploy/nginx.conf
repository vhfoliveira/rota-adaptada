worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        # Daily refreshed data takes precedence; bundled official snapshot is the fallback.
        location ^~ /zarc/ {
            root /var/lib;
            try_files $uri @zarc_seed;
            add_header Cache-Control "no-cache";
        }
        location @zarc_seed {
            root /usr/share/nginx/html;
            try_files $uri =404;
            add_header Cache-Control "no-cache";
        }
        location /assets/ {
            try_files $uri =404;
            expires 1y;
        }
        location ~* \.(json|png|jpg|svg|ico|woff2?)$ {
            try_files $uri =404;
        }
        location / {
            # Navigation uses query parameters at /. Missing or retired paths
            # must return 404 instead of masquerading as application HTML.
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-cache";
        }
    }
}

name: Validate application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rota-adaptada
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rota-adaptada/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run validate:crop-parameters
      - run: python3 scripts/test_zarc_service.py
      - run: npm run build
